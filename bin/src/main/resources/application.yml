spring:
  application:
    name: "help-desk-backend"

  datasource:
    url: jdbc:mysql://localhost:3306/helpdeskdb
    username: root
    password: "0000"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect	
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-nano
          temperature: 1.0
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
server:
  port: 8081
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG



